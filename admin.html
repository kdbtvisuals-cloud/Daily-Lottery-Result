<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel: Daily Lottery Results</title>
    <link rel="stylesheet" href="CSS/admin_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1>Admin Panel</h1>
            <p>Daily Lottery Results</p>
        </div>
        <div class="top-actions">
            <button class="top-btn open-btn" onclick="navPublic()">
                Open Public Page
            </button>
            <button onclick="logout()" class="top-btn logout-btn">
                LogOut
            </button>
        </div>
    </header>

    <div class="main-content">
        <div class="sidebar">
            <div class="menu">
                <a href="#" class="active">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
                <a href="#">
                    <i class="fas fa-plus-circle"></i>
                    Add Result
                </a>
                <a href="#">
                    <i class="fas fa-list"></i>
                    All Results
                </a>
                <a href="#">
                    <i class="fas fa-gear">

                    </i>
                    Settings
                </a>
            </div>
            <div class="quick-actions">
                <h3>Quick Actions</h3>
                <button class="action-btn refresh-btn" onclick="getdata()">
                    Refresh Data
                </button>
                <button class="action-btn public-btn" onclick="navPublic()">
                    Open Public Page
                </button>
            </div>
        </div>

        <div class="main">
            <h1>Dashboard</h1>
            <div class="stats">
                <div class="card">
                    <h3>Total Results</h3>
                    <p id="totalResult"></p>
                </div>
                <div class="card">
                    <h3>Today's Result</h3>
                    <p id="todayResult"></p>
                </div>
                <div class="card">
                    <h3>Last Updated</h3>
                    <p id="lastUpdate"></p>
                </div>
            </div>
            <div class="form-card">
                <h2>Add New Lottery Result</h2>
                <form id="addResult">
                    <div class="form-row">
                        <div>
                            <label>Lottery Name</label>
                            <input id="name" type="text" placeholder="Enter Lottery Name">
                            <span id="errormsg_name"></span>
                        </div>
                        <div>
                            <label>Lottery Number</label>
                            <input id="lottery_name" type="text" placeholder="Enter Lottery Number">
                            <span id="errormsg_lottry_name"></span>
                        </div>
                    </div>
                    <button class="save-btn" type="submit">Save Result</button>
                </form>
            </div>
            <div class="table-section">
                <div class="table-header">PREVIOUS RESULTS</div>

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Lottery Name</th>
                            <th>Winning Number</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="JS/index.js">
    </script>

</body>

</html>
